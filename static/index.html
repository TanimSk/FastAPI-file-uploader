<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload with Compression</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            max-width: 500px;
            background-color: #f4f4f4;
        }
        h2 {
            text-align: center;
        }
        form {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        label, input, select {
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #9bbfe6;
            cursor: not-allowed;
        }
        #response {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 5px;
            word-break: break-all;
        }
        #response pre {
            white-space: pre-wrap;
            word-break: break-all;
        }
        .hidden {
            display: none;
        }
        .preset {
            font-size: 0.85em;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h2>Upload File with Compression</h2>
    <form id="uploadForm">
        <label for="file">Select a File:</label>
        <input type="file" id="file" required>

        <label for="compression">Compression Level (1-100):</label>
        <input type="number" id="compression" min="1" max="100" value="50">

        <div id="keyField" class="hidden">
            <label for="key">API Key:</label>
            <input type="password" id="key" placeholder="Enter your API key" autocomplete="off">
        </div>

        <div id="pathField" class="hidden">
            <label for="path">Storage Path (Optional):</label>
            <input type="text" id="path" placeholder="e.g., images/uploads/">
        </div>

        <div id="presetInfo" class="preset hidden"></div>

        <button type="submit" id="submitBtn">Upload</button>
    </form>

    <div id="response"></div>

    <script>
        // Substituted by the server from BASE_URL in .env; falls back to this
        // page's own origin when the file is opened without the backend.
        const RAW_BASE_URL = "__BASE_URL__";
        const BACKEND_URL = (RAW_BASE_URL && !RAW_BASE_URL.startsWith("__"))
            ? RAW_BASE_URL.replace(/\/+$/, "") + "/"
            : window.location.origin + "/";

        const params = new URLSearchParams(window.location.search);
        // Empty values count as "not provided" so ?key= still shows the input.
        const paramKey = (params.get("key") || "").trim();
        const paramPath = (params.get("path") || "").trim();

        const keyField = document.getElementById("keyField");
        const pathField = document.getElementById("pathField");
        const presetInfo = document.getElementById("presetInfo");

        // Only render an input for what the URL did not already supply.
        if (!paramKey) {
            keyField.classList.remove("hidden");
        }
        if (!paramPath) {
            pathField.classList.remove("hidden");
        }

        const presets = [];
        if (paramKey) presets.push("API key from URL");
        if (paramPath) presets.push(`storage path: ${paramPath}`);
        if (presets.length) {
            presetInfo.textContent = `Using ${presets.join(" · ")}`;
            presetInfo.classList.remove("hidden");
        }

        document.getElementById("uploadForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const fileInput = document.getElementById("file");
            const compressionInput = document.getElementById("compression");
            const submitBtn = document.getElementById("submitBtn");
            const responseBox = document.getElementById("response");

            if (!fileInput.files.length) {
                alert("Please select a file to upload.");
                return;
            }

            const apiKey = paramKey || document.getElementById("key").value.trim();
            if (!apiKey) {
                alert("Please enter an API key.");
                return;
            }

            const storagePath = paramPath || document.getElementById("path").value.trim();
            const compressionLevel = compressionInput.value;

            const query = new URLSearchParams();
            query.set("key", apiKey);
            if (compressionLevel) {
                query.set("compression_level", compressionLevel);
            }
            if (storagePath) {
                query.set("path", storagePath);
            }

            const url = new URL("upload/", BACKEND_URL);
            url.search = query.toString();

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            submitBtn.disabled = true;
            responseBox.innerHTML = "Uploading...";

            try {
                const response = await fetch(url, {
                    method: "POST",
                    body: formData
                });

                const text = await response.text();

                if (!response.ok) {
                    responseBox.innerHTML = `<strong>Error ${response.status}:</strong> ${text}`;
                    return;
                }

                const result = JSON.parse(text);
                const link = result.stored_path
                    ? `<p><a href="${result.stored_path}" target="_blank" rel="noopener">${result.stored_path}</a></p>`
                    : "";
                responseBox.innerHTML = `<strong>Response:</strong>${link}<pre>${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                responseBox.innerHTML = `<strong>Error:</strong> ${error.message}`;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
